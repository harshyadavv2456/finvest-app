name: Macro History (FRED)

# Daily FRED pull of rates, inflation, growth, commodities, FX and credit spreads into R2 (macro/fred_history.parquet) for the NeuroTrom regime features.
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch: {}

jobs:
  fred:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: FinSight/backend/scripts/macro_history.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow boto3 requests
      - run: python FinSight/backend/scripts/macro_history.py
