name: TV Stream (live transcription)

# Captures public finance live streams, transcribes on the runner (faster-whisper, CPU) and appends topic-tagged text to the PRIVATE R2 bucket
# (tv_stream/{date}/{HHMMSS}.jsonl.gz). Same long-loop pattern as news-stream.yml because short cron intervals are unreliable.
# Transcript text is never printed to this public log (counts only). Consumed by the NeuroTrom-finvest model.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "loop length in minutes"
        default: "8"

concurrency:
  group: tv-stream
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: FinSight/backend/scripts/tv_stream.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "boto3>=1.34" "faster-whisper>=1.0" "yt-dlp"
      - run: python FinSight/backend/scripts/tv_stream.py --loop ${{ inputs.minutes || '345' }}
