name: Universe expansion (append-only)

# Weekly: appends big, liquid companies that are not yet in FinSight/tickers.txt (market cap above a per-market USD threshold, so a company that grows past it is picked up automatically).
# It can only ADD lines: the script verifies the original bytes are untouched and restores them otherwise. Every addition is logged in FinSight/ticker_additions.csv.
# The daily refresh reads tickers.txt; new names get 10 years of history on their first fetch and appear in R2 the next day. Appended names are processed last.
on:
  schedule:
    - cron: "0 3 * * 1"          # Mondays 03:00 UTC (08:30 IST)
  workflow_dispatch:
    inputs:
      max_add:
        description: "max tickers to append this run"
        default: "120"

permissions:
  contents: write

concurrency:
  group: universe-expand
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas pytest
      - name: Tests (append-only guarantee)
        run: python -m pytest -q FinSight/backend/scripts/test_expand_universe.py
      - name: Append new large companies
        run: python FinSight/backend/scripts/expand_universe.py --max-add "${{ inputs.max_add || '120' }}"
      - name: Verify nothing was removed or rewritten
        run: |
          git diff --numstat -- FinSight/tickers.txt
          if git diff -- FinSight/tickers.txt | grep -E '^-[^-]' ; then echo "A line was removed or changed - aborting"; exit 1; fi
      - name: Commit additions
        run: |
          if git diff --quiet -- FinSight/tickers.txt FinSight/ticker_additions.csv; then echo "no new tickers"; exit 0; fi
          git config user.name "finvest-universe-bot"
          git config user.email "finvest-universe-bot@users.noreply.github.com"
          git add FinSight/tickers.txt FinSight/ticker_additions.csv
          git commit -m "Universe: append newly qualifying large companies (append-only)"
          git push
