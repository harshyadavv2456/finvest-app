name: Prediction markets (Polymarket + Kalshi)

# Daily probabilities from public prediction-market APIs (not reachable from every home network), stored in R2 as macro/predmarkets_daily.parquet.
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

jobs:
  predmarkets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: predmarkets
      cancel-in-progress: false
    env:
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: FinSight/backend/scripts/predmarkets.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow boto3 requests
      - run: python FinSight/backend/scripts/predmarkets.py
