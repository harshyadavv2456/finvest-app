name: Daily Data Refresh

# Replaces the local, manually-run daily_refresh*.py scripts (see
# REPO_AUDIT_REPORT.md §6A/§7 Phase 4). Runs on GitHub-hosted runners —
# free and unlimited on a public repo, capped at 6h/job on any plan.
#
# Split into independent jobs (not one 2-4h monolith) so a slow/failing
# step doesn't block the rest, reusing the incremental flags already
# built into the pipeline (InsiderFlow's --incremental/--max-age-hours).
#
# Every job writes to R2/Supabase only — none of them touch git. That is
# the structural fix: the "forgot to exclude a folder" failure mode that
# put 173.7GB into this repo's history can't recur if the automated job
# has no code path that runs `git add`/`commit`/`push` for data at all.

on:
  schedule:
    # 00:30 UTC = 06:00 IST, matching the time the README always claimed
    # this ran at (it never actually did — no workflow existed until now).
    - cron: "30 0 * * *"
  workflow_dispatch: {}  # manual trigger, for testing before trusting the schedule

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # Macro overlay (Workstream A/F) - all optional, macro_signals.py degrades
  # gracefully to "unavailable" per-source if any of these are absent.
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
  DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}

jobs:
  market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # was 240; the R2 upload parallelism fix should make this generous margin, not a requirement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r FinSight/backend/requirements.txt
      - name: Update stock prices, fundamentals, technicals
        working-directory: FinSight
        run: python update_all_data.py --tickers tickers.txt
      - name: Upload to R2
        working-directory: FinSight/backend/scripts
        run: python upload_data_to_r2.py

  screener:
    runs-on: ubuntu-latest
    needs: market-data
    timeout-minutes: 90  # was 30 - not enough for a full ~2300-ticker rebuild from scratch (observed: still running, mid-universe, at 30min when killed)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r FinSight/backend/requirements.txt
      - name: Build screener snapshot
        working-directory: FinSight/backend
        run: python -c "from app.screener_snapshot import build_screener_snapshot; build_screener_snapshot()"
      - name: Upload screener snapshot artifact
        # publish-static-bundle runs on its own separate GH Actions runner
        # (every job does) with no filesystem access to what this job just
        # built - without this, that job always found "screener.parquet
        # missing" and failed with "No files found to bundle", every run,
        # forever. Artifacts are the actual cross-job file-sharing
        # mechanism GH Actions provides; there's no shared disk between jobs.
        uses: actions/upload-artifact@v4
        with:
          name: screener-snapshot
          path: FinSight/data/screener.parquet
          retention-days: 1
          if-no-files-found: warn

  insider-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # matches the existing 90-min cap in daily_refresh2.py
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r FinSight/backend/requirements.txt
      - name: SEC Form 4 + 13F (incremental)
        working-directory: FinSight/InsiderFlow
        run: python run_finsight_pipeline.py --incremental --max-age-hours 24
      - name: Commit updated signals_output
        # Real bug found (2026-08-22): this job has never persisted its
        # output anywhere since moving to GH Actions. signals_output/ is
        # git-tracked (not gitignored, unlike data/) - a retired local
        # orchestrator (daily_refresh2.py, referenced in this job's
        # timeout comment) used to commit+push it after every run;
        # that step never got carried over here. git history confirms:
        # last real update to these files was 2026-08-17, days before
        # this fix, despite this job running on schedule every night
        # since - every run's output was silently discarded when its
        # runner was destroyed. Pull-rebase-retry since insider-flow and
        # fii-dii commit concurrently and can race for the same push.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FinSight/InsiderFlow/signals_output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: automated insider-flow refresh $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi

  fii-dii:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r FinSight/backend/requirements.txt
      - name: FII/DII flows
        working-directory: "FinSight/Smart Money Flow"
        run: python fii_dii_pipeline.py
      - name: Commit updated fii_dii_output
        # Same real bug as insider-flow's commit step above - see that
        # step for the full explanation. git history confirmed this
        # job's output was last actually persisted 2026-08-15.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "FinSight/Smart Money Flow/fii_dii_output/"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: automated fii-dii refresh $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi


  indian-announcements:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r FinSight/backend/requirements.txt
      - name: NSE corporate announcements
        working-directory: FinSight/Indian_Announcements
        run: python run_collector_fixed.py
      - name: Upload announcements artifact
        # Same cross-job filesystem gap as screener/alpha-rankings/
        # intelligence - see screener job's upload-artifact step for the
        # full explanation. This is what actually gets the freshly-
        # collected announcements (this job's script wrote to a hardcoded
        # Windows path on every prior run - separately fixed) to
        # publish-static-bundle, and from there to R2 and Render.
        uses: actions/upload-artifact@v4
        with:
          name: announcements
          path: FinSight/data/announcements/
          retention-days: 1
          if-no-files-found: warn

  intelligence:
    runs-on: ubuntu-latest
    needs: [market-data, insider-flow, fii-dii]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r FinSight/backend/requirements.txt pytest
      - name: Hydrate ticker universe from R2
        working-directory: FinSight/backend/scripts
        # discover_universe() in run_full_daily_intelligence.py is a
        # deliberately LOCKED filesystem-only scanner (no R2 fallback by
        # design - fails hard if data/{market}/ is empty). A fresh
        # checkout's data/ dir is always empty (gitignored), so this job
        # hard-failed with "FATAL: No valid stocks found" on every run
        # since the R2 migration - masked earlier by a different startup-
        # validator bug that failed first. Fix: populate local disk from
        # R2 here, before the locked discovery logic runs, rather than
        # touching that logic itself.
        run: python hydrate_universe_from_r2.py
      - name: 9-layer quant intelligence pipeline
        working-directory: FinSight
        # Run as a module (-m), not a bare script path. `quant_system/types.py`
        # shadows Python's own stdlib `types` module the moment
        # quant_system/ itself lands in sys.path[0] (which a bare script
        # invocation always does, for its own directory) - broke this job
        # with "cannot import name 'GenericAlias' from partially
        # initialized module 'types'" the first time it actually ran
        # end-to-end in CI. `-m` puts the CWD (FinSight/) in sys.path[0]
        # instead, where there's no colliding types.py.
        run: python -m quant_system.run_full_daily_intelligence --full-universe
      - name: Regression tests - gate before publishing
        working-directory: FinSight/quant_system
        run: python -m pytest tests/ -v
      - name: Sync intelligence to Supabase
        working-directory: FinSight/backend/scripts
        run: python sync_intelligence_to_supabase.py
      - name: Upload intelligence output artifact
        # Same cross-job filesystem gap as screener's - see that job's
        # upload-artifact step for the full explanation. if: always() so a
        # failed pipeline run still uploads whatever partial output exists
        # rather than publish-static-bundle getting nothing at all from
        # this job on a bad night.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-output
          path: FinSight/public/intelligence/
          retention-days: 1
          if-no-files-found: warn

  alpha-rankings:
    runs-on: ubuntu-latest
    needs: market-data
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r FinSight/backend/requirements.txt
      - name: Score alpha rankings (IntrinsIQ valuation batch)
        working-directory: FinSight
        run: python scripts/alpha_ranking_batch.py
      - name: Upload alpha rankings artifact
        # Same cross-job filesystem gap as screener's - see that job's
        # upload-artifact step for the full explanation.
        uses: actions/upload-artifact@v4
        with:
          name: alpha-tracking
          path: FinSight/data/alpha_tracking/
          retention-days: 1
          if-no-files-found: warn

  # 2026-08-21 fix: Market Intel / Alpha Rankings / IntrinsIQ / real
  # screener count all read small aggregate files (public/intelligence/,
  # data/alpha_tracking/, data/screener.parquet) that this migration off
  # the old local orchestrator never wired into the new pipeline at all -
  # they were bundled to R2 once by hand, and Render's build step
  # (hydrate_from_r2.py) just kept re-downloading that same stale bundle
  # on every deploy, forever. This job closes the loop: re-bundle with
  # today's fresh data, then trigger a Render redeploy so hydrate picks
  # it up (Render has no other way to notice R2 changed - it only reads
  # the bundle at build time, not on a schedule).
  publish-static-bundle:
    runs-on: ubuntu-latest
    needs: [screener, intelligence, alpha-rankings, indian-announcements]
    if: always() && (needs.screener.result == 'success' || needs.intelligence.result == 'success' || needs.alpha-rankings.result == 'success' || needs.indian-announcements.result == 'success')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r FinSight/backend/requirements.txt
      # Pull back what screener/intelligence/alpha-rankings each produced on
      # their own separate runners - this job has never had access to those
      # files otherwise (checkout only restores git-tracked files, and
      # these three are all gitignored, build-time-only outputs). Each
      # download is independent and non-fatal: a job that failed upstream
      # (or one whose upload step didn't run) just means that piece is
      # skipped from the bundle, not that this whole job fails - matches
      # the existing "any succeeded" semantics on this job's `if:` above.
      - name: Download screener snapshot artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: screener-snapshot
          path: FinSight/data/
      - name: Download alpha rankings artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: alpha-tracking
          path: FinSight/data/alpha_tracking/
      - name: Download intelligence output artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: intelligence-output
          path: FinSight/public/intelligence/
      - name: Download announcements artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: announcements
          path: FinSight/data/announcements/
      - name: Bundle + upload public/intelligence, alpha_tracking, screener.parquet to R2
        working-directory: FinSight/backend/scripts
        run: python upload_static_bundle_to_r2.py
      - name: Trigger Render redeploy so hydrate_from_r2.py picks up the fresh bundle
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json"

  notify-status:
    runs-on: ubuntu-latest
    needs: [market-data, screener, insider-flow, fii-dii, indian-announcements, intelligence, alpha-rankings, publish-static-bundle]
    if: always()  # run even if an earlier job failed, so failures get reported
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r FinSight/backend/requirements.txt
      - name: Report pipeline status via existing notifications_api
        working-directory: FinSight/backend
        env:
          JOB_STATUS: ${{ toJSON(needs) }}
        run: |
          python -c "
          import json, os
          from app.notifications_api import send_pipeline_status_alert
          send_pipeline_status_alert(json.loads(os.environ['JOB_STATUS']))
          "
