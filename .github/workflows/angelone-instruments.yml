name: Refresh AngelOne Instrument Master

# Standalone workflow (not a job inside daily-refresh.yml) so this can be
# triggered independently, without waiting on the multi-hour market-data
# crawl - useful when verifying this specific data source.
#
# Confirmed live (2026-08-21): the resumable Range-based download in
# refresh_angelone_instruments.py works and makes steady real progress
# (verified: 13.6MB/37MB, ~37%, after 14 attempts over ~20min) - but each
# individual connection only survives ~1-1.3MB before Angel One's server
# drops it, so completing the full transfer needs well over 20 minutes.
# A run got cancelled mid-download by the job's own timeout before this
# was raised - the download logic was fine, the timeout was just too
# tight for how slow (not broken, just slow) this particular source is.
#
# No AngelOne credentials needed - the instrument master is a public,
# unauthenticated file. Only R2 credentials required, to publish the
# filtered result. Never blocks anything downstream if it fails -
# angelone_provider.py falls back to yFinance regardless.

on:
  schedule:
    - cron: "0 1 * * *"  # daily, offset from daily-refresh's 00:30 UTC start
  workflow_dispatch: {}

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r FinSight/backend/requirements.txt
      - name: Refresh AngelOne instrument master
        working-directory: FinSight/backend/scripts
        run: python refresh_angelone_instruments.py
